<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Yandex site verification. Cloudflare Pages unconditionally redirects any
      *.html URL to its extension-less form at the routing layer (ahead of
      both static assets and Functions), so the "upload an HTML file" method
      Yandex offers can never return a direct 200 here. The meta-tag method
      below verifies the same site ownership without needing a special URL --
      select "Meta tag" (not "HTML file") in Yandex Webmaster.
    -->
    <meta name="yandex-verification" content="12ca997a31ee67f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <title>Pridocs | Free Private File Tools — HEIC, Images, Audio &amp; More</title>
    <meta name="description" content="Free private browser tools: HEIC to JPG, background remover, image compress, OCR, Word Daily, invoices, ZIP, and more. No uploads — files never leave your device." />
    <meta name="keywords" content="free private file tools, heic to jpg, remove background online, compress image no upload, image to text, word daily, invoice pdf generator, zip online, speech to text, exif remover" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Pridocs | Free, Secure & Ad-Free Document and Media Converter" />
    <meta property="og:description" content="Convert files securely right in your browser. Your data never leaves your device. Completely ad-free and tracking-free." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pridocs.org" />
    <meta property="og:image" content="https://pridocs.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pridocs – Free, Secure & Ad-Free Document and Media Converter" />
    <meta property="og:locale" content="en_US" />
    
    <meta name="theme-color" content="#0A2540" />
    <meta name="robots" content="index, follow" />

    <!-- PWA / installability -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pridocs" />
    <link rel="canonical" href="https://pridocs.org/" />
    <meta property="og:site_name" content="Pridocs" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pridocs | Free, Secure & Ad-Free Document and Media Converter" />
    <meta name="twitter:description" content="Convert files securely in your browser. Your data never leaves your device." />
    <meta name="twitter:image" content="https://pridocs.org/og-image.png" />
    <meta name="twitter:image:alt" content="Pridocs – Free, Secure & Ad-Free Document and Media Converter" />

    <!--
      Sitelinks Search Box: tells Google/Bing that pridocs.org has a working
      on-site search, and how to construct a URL for a given query. Whether
      it actually renders under our search result is entirely up to the
      search engine (mainly shown for sites with meaningful branded search
      volume) — this markup only makes it eligible.
      https://developers.google.com/search/docs/appearance/structured-data/sitelinks-searchbox
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pridocs",
      "url": "https://pridocs.org/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pridocs.org/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
